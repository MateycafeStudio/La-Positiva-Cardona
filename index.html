<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú La Positiva Cardona</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col selection:bg-amber-500 selection:text-slate-950">

    <!-- Header Principal -->
    <header class="sticky top-0 z-40 bg-slate-900/95 backdrop-blur border-b border-amber-500/20 shadow-lg">
        <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-3 cursor-pointer" onclick="window.scrollTo({top: 0, behavior: 'smooth'})">
                <div class="h-12 flex items-center justify-center">
                    <img src="logo.png" alt="Logo La Positiva" class="h-10 w-auto object-contain">
                </div>
                <div>
                    <h2 class="font-bold text-sm text-amber-400 tracking-wide">LA POSITIVA</h2>
                    <p class="text-[10px] text-slate-400 font-light">Fructuoso Rivera y Bvar. Artigas — Cardona</p>
                </div>
            </div>
            <!-- Botón del Carrito -->
            <button onclick="toggleCart()" class="relative bg-amber-500 hover:bg-amber-400 text-slate-950 px-4 py-2.5 rounded-xl font-bold flex items-center gap-2 transition shadow-md">
                <i class="fa-solid fa-cart-shopping"></i>
                <span id="cart-count" class="bg-slate-950 text-amber-400 text-xs px-2 py-0.5 rounded-full font-extrabold">0</span>
            </button>
        </div>
    </header>

    <!-- Contenido Principal -->
    <main class="flex-grow max-w-4xl w-full mx-auto px-4 py-6">
        
        <!-- Estado de Horario y Cocina -->
        <div class="bg-slate-900 border border-amber-500/30 rounded-2xl p-4 mb-6 flex flex-col sm:flex-row items-center justify-between gap-3">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-amber-500/10 flex items-center justify-center text-amber-400 text-lg">
                    <i class="fa-regular fa-clock"></i>
                </div>
                <div>
                    <h3 class="text-xs font-bold text-slate-400 uppercase">Horarios de Atención</h3>
                    <p class="text-sm font-semibold text-slate-200">Martes a Domingo (11:00 - 15:00 / 20:00 - 00:00)</p>
                </div>
            </div>
            <!-- Indicador Dinámico de Cocina -->
            <div id="kitchen-status" class="px-3.5 py-1.5 rounded-full text-xs font-bold flex items-center gap-2 border">
                <!-- Generado por JS -->
            </div>
        </div>

        <!-- Categorías del Menú -->
        <div class="flex gap-2 overflow-x-auto pb-3 mb-6 no-scrollbar">
            <button onclick="filterCategory('todos')" class="cat-btn bg-amber-500 text-slate-950 px-4 py-2 rounded-xl text-sm font-bold whitespace-nowrap transition shadow">Todo el Menú</button>
            <button onclick="filterCategory('principales')" class="cat-btn bg-slate-900 text-slate-300 hover:bg-slate-800 px-4 py-2 rounded-xl text-sm font-semibold whitespace-nowrap transition border border-slate-800">Platos Principales</button>
            <button onclick="filterCategory('minutas')" class="cat-btn bg-slate-900 text-slate-300 hover:bg-slate-800 px-4 py-2 rounded-xl text-sm font-semibold whitespace-nowrap transition border border-slate-800">Chivitos & Minutas</button>
            <button onclick="filterCategory('postres')" class="cat-btn bg-slate-900 text-slate-300 hover:bg-slate-800 px-4 py-2 rounded-xl text-sm font-semibold whitespace-nowrap transition border border-slate-800">Postres Caseros</button>
        </div>

        <!-- Grilla de Productos -->
        <div id="products-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <!-- Dinámico -->
        </div>

    </main>

    <!-- Modal del Carrito -->
    <div id="cart-modal" class="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
        <div class="bg-slate-900 w-full max-w-lg rounded-t-3xl sm:rounded-2xl border border-amber-500/30 max-h-[90vh] flex flex-col overflow-hidden shadow-2xl">
            <div class="p-4 border-b border-slate-800 flex items-center justify-between bg-slate-950/50">
                <h3 class="font-bold text-lg text-amber-400 flex items-center gap-2">
                    <i class="fa-solid fa-bag-shopping"></i> Tu Pedido
                </h3>
                <button onclick="toggleCart()" class="text-slate-400 hover:text-white p-2 text-lg"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <div id="cart-items" class="p-4 overflow-y-auto flex-grow divide-y divide-slate-800">
                <!-- Carrito -->
            </div>

            <div class="p-4 bg-slate-950 border-t border-slate-800">
                <div class="mb-3 space-y-2">
                    <label class="block text-xs font-bold text-amber-400 uppercase tracking-wider">Datos de entrega:</label>
                    <input type="text" id="client-name" placeholder="Tu Nombre y Apellido" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-amber-500">
                    <input type="text" id="client-address" placeholder="Dirección de envío o referencia" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-amber-500">
                </div>

                <div class="flex justify-between items-center mb-4 text-base font-bold">
                    <span class="text-slate-300">Total a Pagar:</span>
                    <span id="cart-total" class="text-amber-400 text-xl">$0</span>
                </div>

                <button onclick="sendWhatsAppOrder()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl transition flex items-center justify-center gap-2 shadow-lg">
                    <i class="fa-brands fa-whatsapp text-xl"></i> Enviar Pedido por WhatsApp
                </button>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-slate-900 border-t border-slate-800 py-6 text-center text-xs text-slate-500 mt-auto">
        <p>LA POSITIVA RESTAURANTE</p>
        <p class="mt-1 text-slate-400">Cardona, Soriano • Uruguay</p>
        <p class="mt-2 text-amber-500/70 font-medium">Menú Digital interactivo integrado con WhatsApp API</p>
    </footer>

    <!-- Script de Lógica -->
    <script>
        const products = [
            { id: 1, name: "Chivito al Plato con Fritas", category: "principales", price: 480, desc: "Clásico chivito oriental super abundante: lomo tierno, jamón, queso, huevo frito, panceta crocante y vegetales frescos con papas fritas.", image: "https://images.unsplash.com/photo-1550547660-d9450f859349?w=500&auto=format&fit=crop&q=60" },
            { id: 2, name: "Milanesa Napolitana con Fritas", category: "principales", price: 520, desc: "Generosa milanesa cubierta con salsa de tomate de la casa, jamón cocido, muzarella gratinada y huevo frito con guarnición de papas.", image: "https://images.unsplash.com/photo-1626082927389-6cd097cdc6ec?w=500&auto=format&fit=crop&q=60" },
            { id: 3, name: "Colita de Cuadril con Guarnición", category: "principales", price: 650, desc: "Corte jugoso de colita de cuadril a las brasas asado en su punto justo, acompañado con ensalada rusa o papas fritas.", image: "https://images.unsplash.com/photo-1544025162-d76694265947?w=500&auto=format&fit=crop&q=60" },
            { id: 4, name: "Chajá Durazno / Frutilla", category: "postres", price: 220, desc: "El postre tradicional uruguayo más aclamado. Capas de merengue suave, crema batida, bizcochuelo y durazno o frutilla.", image: "https://images.unsplash.com/photo-1587314168485-3236d6710814?w=500&auto=format&fit=crop&q=60" },
            { id: 5, name: "Flan Casero con Dulce de Leche", category: "postres", price: 180, desc: "Receta casera tradicional con caramelo artesanal y copón de dulce de leche uruguayo.", image: "https://images.unsplash.com/photo-1527515637462-cff94eecc1ac?w=500&auto=format&fit=crop&q=60" }
        ];

        let cart = [];

        function checkKitchenStatus() {
            const now = new Date();
            const hours = now.getHours();
            const minutes = now.getMinutes();
            const currentTime = hours * 60 + minutes;

            // Turnos: 11:00 a 15:00 (660 a 900) y 20:00 a 00:00 (1200 a 1440)
            const lunchOpen = currentTime >= 660 && currentTime <= 900;
            const dinnerOpen = currentTime >= 1200 && currentTime <= 1440;
            const isOpen = lunchOpen || dinnerOpen;

            const badge = document.getElementById('kitchen-status');
            if (isOpen) {
                badge.className = "px-3.5 py-1.5 rounded-full text-xs font-bold flex items-center gap-2 bg-emerald-500/10 text-emerald-400 border border-emerald-500/30";
                badge.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Cocina Abierta`;
            } else {
                badge.className = "px-3.5 py-1.5 rounded-full text-xs font-bold flex items-center gap-2 bg-rose-500/10 text-rose-400 border border-rose-500/30";
                badge.innerHTML = `<span class="w-2 h-2 rounded-full bg-rose-500"></span> Cocina Cerrada`;
            }
        }

        function renderProducts(cat) {
            const grid = document.getElementById('products-grid');
            const filtered = cat === 'todos' ? products : products.filter(p => p.category === cat);
            
            grid.innerHTML = filtered.map(p => `
                <div class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-lg flex flex-col justify-between hover:border-amber-500/40 transition">
                    <div>
                        <div class="h-44 overflow-hidden relative">
                            <img src="${p.image}" alt="${p.name}" class="w-full h-full object-cover">
                            <span class="absolute top-2 right-2 bg-slate-950/80 backdrop-blur text-amber-400 font-extrabold text-xs px-2.5 py-1 rounded-lg border border-amber-500/20">$${p.price}</span>
                        </div>
                        <div class="p-4">
                            <h3 class="font-bold text-base text-slate-100">${p.name}</h3>
                            <p class="text-xs text-slate-400 mt-1">${p.desc}</p>
                            
                            <!-- Bloque ampliado para detalles extras -->
                            <div class="mt-3">
                                <label class="block text-[11px] font-bold text-amber-400/90 uppercase mb-1">Detalles extras:</label>
                                <input type="text" id="note-${p.id}" placeholder="Ej: Sin sal, salsa aparte, bien cocido..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-amber-500">
                            </div>
                        </div>
                    </div>
                    
                    <!-- Botón de pedir más acortado -->
                    <div class="p-4 pt-0">
                        <button onclick="addToCart(${p.id})" class="w-auto ml-auto bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-xs px-4 py-2 rounded-xl transition flex items-center justify-center gap-1.5 shadow">
                            <i class="fa-solid fa-plus">+ Pedir</i>
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function filterCategory(cat) {
            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.className = "cat-btn bg-slate-900 text-slate-300 hover:bg-slate-800 px-4 py-2 rounded-xl text-sm font-semibold whitespace-nowrap transition border border-slate-800";
            });
            event.target.className = "cat-btn bg-amber-500 text-slate-950 px-4 py-2 rounded-xl text-sm font-bold whitespace-nowrap transition shadow";
            renderProducts(cat);
        }

        function addToCart(id) {
            const product = products.find(p => p.id === id);
            const noteInput = document.getElementById(`note-${id}`);
            const note = noteInput ? noteInput.value.trim() : '';
            
            const existing = cart.find(item => item.id === id && item.note === note);
            if (existing) {
                existing.qty++;
            } else {
                cart.push({ ...product, qty: 1, note: note });
            }
            if(noteInput) noteInput.value = '';
            updateCartUI();
        }

        function updateCartUI() {
            const totalCount = cart.reduce((sum, item) => sum + item.qty, 0);
            document.getElementById('cart-count').innerText = totalCount;
            
            const container = document.getElementById('cart-items');
            if (cart.length === 0) {
                container.innerHTML = `<p class="text-center text-slate-500 py-8 text-sm">Tu carrito está vacío.</p>`;
                document.getElementById('cart-total').innerText = '$0';
                return;
            }

            container.innerHTML = cart.map((item, index) => `
                <div class="py-3 flex items-center justify-between text-sm">
                    <div class="flex-grow pr-2">
                        <h4 class="font-bold text-slate-200">${item.name}</h4>
                        ${item.note ? `<p class="text-[11px] text-amber-400 italic">Nota: ${item.note}</p>` : ''}
                        <span class="text-xs text-slate-400">$${item.price} x ${item.qty}</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <button onclick="changeQty(${index}, -1)" class="w-7 h-7 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg font-bold flex items-center justify-center">-</button>
                        <span class="text-xs font-bold w-4 text-center">${item.qty}</span>
                        <button onclick="changeQty(${index}, 1)" class="w-7 h-7 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg font-bold flex items-center justify-center">+</button>
                    </div>
                </div>
            `).join('');

            const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            document.getElementById('cart-total').innerText = `$${totalPrice}`;
        }

        function changeQty(index, delta) {
            cart[index].qty += delta;
            if (cart[index].qty <= 0) {
                cart.splice(index, 1);
            }
            updateCartUI();
        }

        function toggleCart() {
            document.getElementById('cart-modal').classList.toggle('hidden');
        }

        function sendWhatsAppOrder() {
            if (cart.length === 0) {
                alert("Agregá al menos un producto a tu pedido.");
                return;
            }
            const name = document.getElementById('client-name').value.trim();
            const address = document.getElementById('client-address').value.trim();

            if (!name || !address) {
                alert("Por favor completá tu nombre y dirección de envío.");
                return;
            }

            let message = `*¡NUEVO PEDIDO - LA POSITIVA!*\n\n`;
            message += `👤 *Cliente:* ${name}\n`;
            message += `📍 *Dirección:* ${address}\n\n`;
            message += `🛒 *Detalle del pedido:*\n`;
            
            cart.forEach(item => {
                message += `• ${item.qty}x ${item.name} ($${item.price * item.qty})`;
                if(item.note) message += ` _(Nota: ${item.note})_`;
                message += `\n`;
            });

            const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            message += `\n💰 *Total a abonar:* $${totalPrice}`;

            const phone = "59899263100";
            const url = `https://wa.me/${phone}?text=${encodeURIComponent(message)}`;
            window.open(url, '_blank');
        }

        // Inicializar
        checkKitchenStatus();
        renderProducts('todos');
    </script>
</body>
</html>
